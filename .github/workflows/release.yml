name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: html-inject-scan-linux-x86_64
          - os: macos-latest
            asset: html-inject-scan-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev zlib1g-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DHIS_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Rename binary
        run: |
          BIN=$(find build -maxdepth 3 -name html-inject-scan -type f | head -n1)
          cp "$BIN" "${{ matrix.asset }}"

      - name: Attach binary to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.asset }}
